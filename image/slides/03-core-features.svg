    <circle cx="1625" cy="340" r="66" fill="#A78BFA" opacity="0.25"/>
    <rect x="1577" y="292" width="96" height="96" rx="20" fill="#8B5CF6"/>
    <text x="1560" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Vote</text>
    <text x="1490" y="560" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="30">Decide plans</text>
    <text x="1490" y="600" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="30">in one tap</text>
  </g>

  <text x="140" y="1010" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="34">A single app for daily family coordination</text>
